name: host

on:
  push:
    branches: [main]
    paths: ['host/**', '.github/workflows/host.yml']
  pull_request:
    paths: ['host/**', '.github/workflows/host.yml']

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: host

jobs:
  build:
    name: build + lint (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint (swift-format)
        run: swift format lint --recursive Sources Package.swift

      - name: Package preview host app
        run: |
          scripts/make-app.sh host --adhoc
          ditto -c -k --sequesterRsrc --keepParent "build/Transom Host.app" "build/Transom-Mac-Host-preview.zip"

      - name: Upload preview host
        uses: actions/upload-artifact@v4
        with:
          name: Transom-Mac-Host
          path: host/build/Transom-Mac-Host-preview.zip
